name: Skill CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  skill-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl

      - name: Run skill evals
        run: python3 scripts/run_skill_evals.py

      - name: Compile scripts
        run: PYTHONPYCACHEPREFIX=/tmp/cumcm_pycache python3 -m py_compile scripts/*.py

      - name: Validate full demo artifacts
        run: |
          python3 scripts/validate_results.py \
            --project examples/full_problem_demo \
            --output results/validation_audit.md

      - name: Generate demo roadmap SVG
        run: |
          python3 scripts/make_roadmap_svg.py \
            --task-plan examples/full_problem_demo/problem/task_plan.json \
            --output /tmp/cumcm_roadmap.svg
          test -s /tmp/cumcm_roadmap.svg
